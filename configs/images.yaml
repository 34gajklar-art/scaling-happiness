# LXC镜像构建配置文件
# 支持多个发行版，每个镜像都会安装SSH并配置root密码登录

# CentOS 9-Stream
- name: centos-9-stream-cloud-amd64-ssh
  distro: centos
  release: "9-Stream"
  arch: amd64
  variant: cloud
  packages:
    - curl
    - wget
    - vim
    - htop
    - net-tools
    - openssh-clients
  files:
    /etc/motd: |
      Welcome to CentOS 9-Stream Cloud LXC Container with SSH
      Root password: password
      SSH is enabled on port 22
  actions:
    - type: post-files
      action: run
      options:
        command: "dnf update -y"

